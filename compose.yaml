services:
  aegis-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aegis-ai-decision-intelligence:local
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      AEGIS_DATABASE_PATH: /app/data/aegis.db
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - aegis_data:/app/data
      - aegis_model_cache:/home/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  aegis_data:
  aegis_model_cache:
