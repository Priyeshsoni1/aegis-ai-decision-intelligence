[project]
name = "aegis"
version = "0.1.0"
description = "AI-powered due diligence and decision intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aegis Engineering Team" }
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"